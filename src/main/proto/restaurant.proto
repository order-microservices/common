syntax = "proto3";
import "command.proto";
package com.kasjan.command.proto;

message ValidateRestaurantCommand {
  string commandId = 1;
  string orderId = 2;
  string accountId = 3;
  string restaurantId = 4;
  CommandType type = 5;
  string xRayId = 6;
}

service RestaurantService {
  rpc checkRestaurant(ValidateRestaurantCommand) returns (DefaultCommandResponse);
}
