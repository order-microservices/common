syntax = "proto3";
package com.kasjan.command.proto;

enum CommandType {
  CREATE_ORDER = 0;
  VALIDATE_PAYMENT = 1;
  VOID_PAYMENT = 2;
  CHECK_RESTAURANT_AVAILABILITY = 3;
  ASSIGN_COURIER = 4;
  UNASSIGN_COURIER = 5;
  CANCEL_ORDER = 6;
}

message DefaultCommandResponse {
  bool success = 1;
  string error_msg = 2;
}
