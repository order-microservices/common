syntax = "proto3";
package com.kasjan.command.proto;

enum CommandType {
  NULL = 0;
  CREATE_ORDER = 1;
  VALIDATE_PAYMENT = 2;
  VOID_PAYMENT = 3;
  CHECK_RESTAURANT_AVAILABILITY = 4;
  ASSIGN_COURIER = 5;
  ACCEPT_OFFER = 6;
  UNASSIGN_COURIER = 7;
  PICK_UP_ORDER = 8;
  CANCEL_ORDER = 9;
  UPDATE_COURIER_STATUS = 10;
  DELIVER_ORDER = 11;
}

message DefaultCommandResponse {
  bool success = 1;
  string error_msg = 2;
}

message Location {
  double latitude = 1;
  double longitude = 2;
}
